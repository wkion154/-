[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "k-idol-archive"
version = "0.7.1"
description = "Local-first artist photo archive and viewer"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3", "Pillow==11.2.1"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-qt==4.4.0"]
browser = ["playwright==1.62.0"]
[project.scripts]
k-idol-archive = "app.main:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["."]
